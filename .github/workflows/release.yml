name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm run package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath *.vsix -p ${{ secrets.VSCE_PAT }}
        if: env.HAS_VSCE_PAT == 'true'
        env:
          HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      - name: Publish to Open VSX Registry
        run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}
        if: env.HAS_OVSX_TOKEN == 'true'
        env:
          HAS_OVSX_TOKEN: ${{ secrets.OVSX_TOKEN != '' }}
